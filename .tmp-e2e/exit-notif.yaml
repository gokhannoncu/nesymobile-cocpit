appId: com.arasdigital.nesymobile.rstest
---
- pressKey: Back
- pressKey: Back
- pressKey: Back
- tapOn:
    id: "com.arasdigital.nesymobile.rstest:id/btn_exit"
    optional: true
- extendedWaitUntil:
    visible: "Stop List"
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: "Stop List"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/iv_home"
          optional: true
- takeScreenshot: .tmp-e2e/after-notif-exit

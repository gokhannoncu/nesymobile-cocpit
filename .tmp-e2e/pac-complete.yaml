appId: com.arasdigital.nesymobile.rstest
---
# Dismiss dialogs / back to Stop List
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Write barcode number"
    commands:
      - pressKey: Back
- runFlow:
    when:
      visible: "12. Stop Tasks"
    commands:
      - pressKey: Back
- runFlow:
    when:
      visible: "Task"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/manuel_input"
    timeout: 20000
# Open _CASH stop via scan of already-picked piece OR stay on list and scan PAC DELY
- tapOn:
    id: "com.arasdigital.nesymobile.rstest:id/manuel_input"
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/et_input_dialog_barcode_number"
    timeout: 12000
- tapOn:
    id: "com.arasdigital.nesymobile.rstest:id/et_input_dialog_barcode_number"
- eraseText: 100
- inputText: "6880051000264114"
- hideKeyboard
- tapOn:
    id: "com.arasdigital.nesymobile.rstest:id/btn_ok"
# Path: Pick Up / Pickup Failed
- runFlow:
    when:
      visible: "Which operation do you want for this shipment?"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/btn_arasDg_positive_button"
# Path: select PAC waybill from list dialog
- runFlow:
    when:
      visible: "74901237799972"
    commands:
      - tapOn: "74901237799972"
- runFlow:
    when:
      visible:
        id: "com.arasdigital.nesymobile.rstest:id/complete_task"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/complete_task"
# If landed on Task Waiting For Pickup — scan again
- runFlow:
    when:
      visible: "Waiting For Pickup"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/manuel_input"
      - extendedWaitUntil:
          visible:
            id: "com.arasdigital.nesymobile.rstest:id/et_input_dialog_barcode_number"
          timeout: 10000
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/et_input_dialog_barcode_number"
      - eraseText: 100
      - inputText: "6880051000264114"
      - hideKeyboard
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/btn_ok"
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/complete_task"
    timeout: 25000
    optional: true
- runFlow:
    when:
      visible:
        id: "com.arasdigital.nesymobile.rstest:id/complete_task"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/complete_task"
- runFlow:
    when:
      visible:
        id: "com.arasdigital.nesymobile.rstest:id/btn_arasDg_positive_button"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/btn_arasDg_positive_button"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible: "Picked Up"
    timeout: 25000
    optional: true
- pressKey: Back
- extendedWaitUntil:
    visible: "Stop List"
    timeout: 20000
    optional: true

appId: com.arasdigital.nesymobile.rstest
---
- extendedWaitUntil:
    visible:
      id: "/manuel_input"
    timeout: 20000
- tapOn:
    id: "/manuel_input"
- extendedWaitUntil:
    visible:
      id: "/et_input_dialog_barcode_number"
    timeout: 8000
- tapOn:
    id: "/et_input_dialog_barcode_number"
- eraseText: 80
- inputText: "6880051000263414"
- tapOn:
    id: "/btn_ok"
- extendedWaitUntil:
    visible:
      id: "/btnDelivery"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "/btnDelivery"
    commands:
      - tapOn:
          id: "/btnDelivery"
- extendedWaitUntil:
    visible:
      id: "/tie_delivery_name"
    timeout: 25000
- tapOn:
    id: "/tie_delivery_name"
- inputText: "Test Receiver"
- pressKey: Enter
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "/btn_deliver"
    direction: DOWN
    timeout: 15000
- swipe:
    start: "25%, 78%"
    end: "75%, 78%"
    duration: 500
- tapOn:
    id: "/btn_deliver"
- runFlow:
    when:
      visible:
        id: "/btnDely"
    commands:
      - tapOn:
          id: "/btnDely"
- runFlow:
    when:
      visible:
        id: "/btn_arasDg_positive_button"
    commands:
      - tapOn:
          id: "/btn_arasDg_positive_button"
- runFlow:
    when:
      visible:
        id: "/btn_arasDg_positive_button"
    commands:
      - tapOn:
          id: "/btn_arasDg_positive_button"
- extendedWaitUntil:
    visible: "Stop List"
    timeout: 45000
    optional: true

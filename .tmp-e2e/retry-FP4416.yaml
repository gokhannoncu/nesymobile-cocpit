appId: com.arasdigital.nesymobile.rstest
---
# Zimmet with optional Time Range branch â€” 6880051000263018 replaced per run
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/manuel_input"
    timeout: 15000
- tapOn:
    id: "com.arasdigital.nesymobile.rstest:id/manuel_input"
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/et_input_dialog_barcode_number"
    timeout: 5000
- tapOn:
    id: "com.arasdigital.nesymobile.rstest:id/et_input_dialog_barcode_number"
- eraseText: 80
- inputText: "6880051000263018"
- tapOn:
    id: "com.arasdigital.nesymobile.rstest:id/btn_ok"
# Optional dialogs
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/tv_arasDg_title"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: "com.arasdigital.nesymobile.rstest:id/btn_arasDg_positive_button"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/btn_arasDg_positive_button"
# Time Range branch
- extendedWaitUntil:
    visible: "Select Time Range"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Select Time Range"
    commands:
      - tapOn: "07:00 - 09:00"
      - tapOn: "Select"
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/tv_arasDg_title"
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible:
        id: "com.arasdigital.nesymobile.rstest:id/btn_arasDg_positive_button"
    commands:
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/btn_arasDg_positive_button"
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/manuel_input"
    timeout: 25000


appId: "com.arasdigital.nesymobile.rstest"
---

# ===== STEP: launch_app_25 (LAUNCH_APP) =====
- evalScript: ${console.log("NESY_STEP::START::launch_app_25::LAUNCH_APP")}
- runFlow:
    file: flows/step-01-LAUNCH_APP-launch_app_25.yaml
- evalScript: ${console.log("NESY_STEP::DONE::launch_app_25::LAUNCH_APP")}

# ===== STEP: if_login_26 (IF_LOGIN) — runtime UI fallback =====
- evalScript: ${console.log("NESY_STEP::START::if_login_26::IF_LOGIN")}
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/btn_login"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: "com.arasdigital.nesymobile.rstest:id/btn_login"
    commands:
      - evalScript: ${console.log("NESY_STEP::START::auth_login_27::AUTH_LOGIN")}
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/pinView"
      - inputText: "3680"
      - tapOn:
          id: "com.arasdigital.nesymobile.rstest:id/btn_login"
      - evalScript: ${console.log("NESY_STEP::DONE::auth_login_27::AUTH_LOGIN")}
- evalScript: ${console.log("NESY_STEP::DONE::if_login_26::IF_LOGIN")}

# ===== STEP: validate_stoplist_30 (VALIDATE_STOPLIST) =====
- evalScript: ${console.log("NESY_STEP::START::validate_stoplist_30::VALIDATE_STOPLIST")}
- runFlow:
    file: flows/step-02-VALIDATE_STOPLIST-validate_stoplist_30.yaml
- evalScript: ${console.log("NESY_STEP::DONE::validate_stoplist_30::VALIDATE_STOPLIST")}

appId: "com.arasdigital.nesymobile.rstest"
---
- launchApp:
    appId: "com.arasdigital.nesymobile.rstest"
    clearState: false
- waitForAnimationToEnd
# Samsung system "app compatibility" warning (debuggable build / 16KB page size)
# covers the app on the first launch after install or data-clear. If left up it
# eats the whole run — every branch probe WARNs yet Maestro exits 0 (false
# success). Dismiss via "Don't show again" so it also self-suppresses. TR/EN text.
- runFlow:
    when:
      visible:
        text: "Bir Daha Gösterme|Don.t show again"
    commands:
      - tapOn:
          text: "Bir Daha Gösterme|Don.t show again"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/pinView"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/manuel_input"
    timeout: 2500
    optional: true
- extendedWaitUntil:
    visible:
      id: "com.arasdigital.nesymobile.rstest:id/btn_out"
    timeout: 2500
    optional: true
